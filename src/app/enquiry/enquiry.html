<div class="container py-4">

    <div class="col-lg-6">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">{{enquiryObj().EnquiryId==0?'Create': 'Edit'}} Enquiry</h3>
                <small class="text-muted">Enquiry / {{enquiryObj().EnquiryId==0?'Create': 'Edit'}}</small>
            </div>

            <button class="btn btn-primary" (click) = "createEnquiry()">
                Create
            </button>

            <button class="btn btn-primary" (click) = "goToEnquiryList()">
                Enquiry List
            </button>

        </div>

        <form #form="ngForm">

            <!-- Customer Information -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="enquiry-card">

                    <div class="row g-3">

                        <div class="col-md-8">
                            <label class="form-label">Customer Name</label>
                            <input type="text" name ="customername" class="form-control" 
                                [(ngModel)] ="enquiryObj().CustomerName" placeholder="Enter Customer Name">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Address</label>
                            <input type="text" name ="customeraddress" class="form-control" 
                                [(ngModel)] ="enquiryObj().CustomerAddress" laceholder="Enter Customer Address">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Mobile No.</label>
                            <input type="text" name ="phoneno" class="form-control" 
                                [(ngModel)] ="enquiryObj().PhoneNo" placeholder="Enter Mobile / Phone No."> 
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name ="emailadd" class="form-control" 
                                [(ngModel)] ="enquiryObj().EmailAdd" placeholder="Enter Email Address">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Detail</label>
                            <textarea rows="4" name ="enquirydetail" class="form-control" 
                                [(ngModel)] ="enquiryObj().EnquiryDetail" placeholder="Enter Enquiry Detail"></textarea>
                        </div>

                    </div>

                </div>

            </div>

            <!-- Buttons -->
            <div class="row">
                <div class="col-lg-3">
                    <button class="btn btn-success me-2" (click) = "saveEnquiry()" style="width: 100%;">
                        Save
                    </button>
                </div>
                <div class="col-lg-3">
                    <button class="btn btn-warning" style="width: 100%;">
                        Reset
                    </button>
                </div>
            </div>

        </form>
    </div>
</div>
